[build-system]
requires = [
    "hatchling>=1.27.0",
    "vapoursynth>=74",
    "meson",
    "ninja",
    "packaging",
]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-sneedif"
dynamic = ["version"]
description = "Intra-field only deinterlacer based on NNEDI3"
readme = "README.md"
license = "WTFPL AND GPL-3.0-or-later AND BSD-3-Clause"
license-files = [
    "LICENSE",
    "SNEEDIF/half_float/LICENSE",
]
requires-python = ">=3.12"
authors = [{ name = "Setsugen no ao", email = "setsugen@setsugen.dev" }]
maintainers = [
    { name = "Jaded Encoding Thaumaturgy", email = "jaded.encoding.thaumaturgy@gmail.com" },
]
dependencies = ["vapoursynth>=74"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "License :: OSI Approved :: BSD License",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[dependency-groups]
dev = ["hatchling>=1.27.0", "packaging"]

[project.urls]
"Source Code" = "https://github.com/Jaded-Encoding-Thaumaturgy/vapoursynth-SNEEDIF"
"Bug Tracker" = "https://github.com/Jaded-Encoding-Thaumaturgy/vapoursynth-SNEEDIF/issues"
"Contact" = "https://discord.gg/XTpc6Fa9eB"

[tool.hatch.version]
path = "meson.build"
pattern = "version: '(?P<version>\\d*.\\d*)'"

[tool.hatch.build.targets.sdist]
include = ["asset", "SNEEDIF", "meson.build", "hatch_build.py"]

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
    "vapoursynth/plugins/**/*.dylib",
    "vapoursynth/plugins/**/*.so",
    "vapoursynth/plugins/**/*.dll",
    "vapoursynth/plugins/**/*.bin",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.cibuildwheel]
build-frontend = { name = "build[uv]", args = ["--verbose"] }
build = "cp312-*"
skip = ["*-manylinux_i686", "*-musllinux_i686", "*-win32"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"
repair-wheel-command = "auditwheel repair --strip -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
before-all = "brew install boost"
environment.MACOSX_DEPLOYMENT_TARGET = "15.0"

[[tool.cibuildwheel.overrides]]
select = "*-manylinux*"
before-all = [
    "dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb",
    "dnf install -y cmake gcc-c++ boost-devel opencl-headers ocl-icd-devel git",
]

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = "apk add --no-cache cmake g++ boost-dev opencl-headers opencl-dev opencl git"
